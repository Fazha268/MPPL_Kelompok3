<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - Sortify AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary-green: #059669;
            --light-green: #ecfdf5;
            --accent-green: #10b981;
        }
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { backdrop-filter: blur(10px); background-color: rgba(5, 150, 105, 0.95) !important; }
        .card { border: none; border-radius: 1.75rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .nav-pills .nav-link.active { background-color: var(--primary-green); font-weight: 600; }
        .nav-pills .nav-link { color: var(--primary-green); font-weight: 500; }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
        }
        .badge-card {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 1rem;
            transition: all 0.3s;
        }
        .badge-card.unlocked {
            background: var(--light-green);
            border-color: var(--accent-green);
            border-style: solid;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3 mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="upload.html">
                <i class="bi bi-recycle text-light fs-3"></i> Sortify <span class="badge bg-light text-success fs-6">AI Pro</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="upload.html"><i class="bi bi-cpu me-1"></i> Smart Scan</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="dashboard.html"><i class="bi bi-trophy me-1"></i> Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="kuis.html"><i class="bi bi-controller me-1"></i> Kuis Edukasi</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="panduan.html"><i class="bi bi-journal-text me-1"></i> Panduan</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="profile.html" class="text-white text-decoration-none small bg-success bg-opacity-75 px-3 py-2 rounded-pill border border-light fw-bold" id="welcomeUser">
                        <i class="bi bi-person-circle me-1"></i> Memuat...
                    </a>
                    <button class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i> Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 800px;">
        <div class="card shadow-lg p-4 p-md-5 animate__animated animate__fadeInUp mb-4">
            <div class="text-center">
                <div class="profile-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1" id="profileName">Nama Pengguna</h3>
                <p class="text-muted mb-3" id="profileClass">Kelas -</p>
                <span class="badge bg-success bg-opacity-10 text-success fw-bold px-3 py-2 rounded-pill fs-6" id="profilePoints">
                    <i class="bi bi-star-fill text-warning me-1"></i> 0 Poin Total
                </span>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Form Edit Profil -->
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-pencil-square me-2"></i>Pengaturan Akun</h5>
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">Nama Lengkap</label>
                        <input type="text" id="inputNama" class="form-control rounded-pill px-3 py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">Kelas / Instansi</label>
                        <input type="text" id="inputKelas" class="form-control rounded-pill px-3 py-2" required>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="submit" class="btn btn-success rounded-pill px-4 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
            <div id="updateAlert" class="mt-3"></div>
        </div>

        <!-- Bagian Lencana / Pencapaian Interaktif -->
        <div class="card shadow-lg p-4 p-md-5 animate__animated animate__fadeInUp">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-award-fill me-2"></i>Lencana Pencapaian Pahlawan Lingkungan</h5>
            <div class="row g-3" id="badgesContainer">
                <!-- Diisi dinamis via JavaScript berdasarkan poin -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let userId = localStorage.getItem('user_id');
        let namaUser = localStorage.getItem('nama_user');
        let kelasUser = localStorage.getItem('kelas_user');

        const rawUser = localStorage.getItem('user');
        if (!userId && rawUser) {
            try {
                const parsed = JSON.parse(rawUser);
                userId = parsed.id;
                namaUser = parsed.nama;
                kelasUser = parsed.kelas;
            } catch (e) { console.error(e); }
        }

        if (!userId) {
            window.location.href = 'index.html';
        } else {
            loadUserData();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadUserData() {
            try {
                // Ambil data terbaru dari leaderboard API untuk mendapatkan total_poin akurat
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const currentUser = data.find(u => u.id == userId);

                if (currentUser) {
                    namaUser = currentUser.nama;
                    kelasUser = currentUser.kelas;
                    const totalPoin = currentUser.total_poin || 0;

                    document.getElementById('welcomeUser').innerHTML = `<i class="bi bi-person-circle me-1"></i> ${namaUser} (${kelasUser})`;
                    document.getElementById('profileName').innerText = namaUser;
                    document.getElementById('profileClass').innerText = `Kelas: ${kelasUser}`;
                    document.getElementById('profilePoints').innerHTML = `<i class="bi bi-star-fill text-warning me-1"></i> ${totalPoin} Poin Total`;
                    
                    document.getElementById('inputNama').value = namaUser;
                    document.getElementById('inputKelas').value = kelasUser;

                    renderBadges(totalPoin);
                }
            } catch (err) {
                console.error("Gagal memuat data profil:", err);
            }
        }

        async function updateProfile(event) {
            event.preventDefault();
            const newNama = document.getElementById('inputNama').value.trim();
            const newKelas = document.getElementById('inputKelas').value.trim();
            const alertDiv = document.getElementById('updateAlert');

            try {
                const res = await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, nama: newNama, kelas: newKelas })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('nama_user', newNama);
                    localStorage.setItem('kelas_user', newKelas);
                    alertDiv.innerHTML = `<div class="alert alert-success rounded-pill py-2 text-center small">Profil berhasil diperbarui!</div>`;
                    loadUserData();
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-danger rounded-pill py-2 text-center small">${data.message}</div>`;
                }
            } catch (err) {
                console.error(err);
                alertDiv.innerHTML = `<div class="alert alert-danger rounded-pill py-2 text-center small">Gagal terhubung ke server.</div>`;
            }
        }

        function renderBadges(poin) {
            const badges = [
                { title: "🌱 Eco Starter", desc: "Mulai bergabung di Sortify AI", minPoin: 0, icon: "bi-seedling" },
                { title: "♻️ Pemilah Aktif", desc: "Mencapai minimal 30 Poin", minPoin: 30, icon: "bi-recycle" },
                { title: "🏆 Pejuang Daur Ulang", desc: "Mencapai minimal 70 Poin", minPoin: 70, icon: "bi-award" },
                { title: "🌟 Pahlawan Lingkungan", desc: "Mencapai minimal 150 Poin", minPoin: 150, icon: "bi-shield-check" }
            ];

            const container = document.getElementById('badgesContainer');
            container.innerHTML = '';

            badges.forEach(b => {
                const isUnlocked = poin >= b.minPoin;
                const cardClass = isUnlocked ? 'badge-card unlocked shadow-sm' : 'badge-card opacity-50';
                const iconColor = isUnlocked ? 'text-success' : 'text-muted';

                container.innerHTML += `
                    <div class="col-md-6">
                        <div class="${cardClass} p-3 d-flex align-items-center gap-3">
                            <div class="fs-2 ${iconColor} bg-white p-3 rounded-circle shadow-sm">
                                <i class="bi ${b.icon}"></i>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-1">${b.title} ${isUnlocked ? '<span class="badge bg-success small">Terbuka</span>' : '<span class="badge bg-secondary small">Terkunci</span>'}</h6>
                                <p class="text-muted small mb-0">${b.desc} (${b.minPoin} Poin)</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
