<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scan - Sortify AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary-green: #059669; --light-green: #ecfdf5; --accent-green: #10b981; }
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { backdrop-filter: blur(10px); background-color: rgba(5, 150, 105, 0.95) !important; }
        .card { border: none; border-radius: 1.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .nav-pills .nav-link.active { background-color: var(--primary-green); font-weight: 600; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
        .nav-pills .nav-link { color: var(--primary-green); font-weight: 500; }
        .preview-box { border: 2px dashed var(--accent-green); border-radius: 1.25rem; background-color: var(--light-green); min-height: 260px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        video, canvas, #imagePreview, #capturedPreview { max-width: 100%; max-height: 280px; border-radius: 1rem; object-fit: contain; }
        .btn-success { background-color: var(--primary-green); border: none; }
        .result-card { border-left: 5px solid var(--primary-green); background: #ffffff; }
        
        /* Efek Animasi Scanning Laser Interaktif */
        .scanning-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 150, 105, 0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(3px); }
        .scanner-line { width: 80%; height: 3px; background: #10b981; box-shadow: 0 0 15px #10b981; animation: scanMove 1.5s infinite alternate ease-in-out; position: absolute; }
        @keyframes scanMove { 0% { top: 10%; } 100% { top: 90%; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3 mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="upload.html">
                <i class="bi bi-recycle text-light fs-3"></i> Sortify <span class="badge bg-light text-success fs-6">AI Pro</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link active rounded-pill px-3 py-2" href="upload.html"><i class="bi bi-cpu me-1"></i> Smart Scan</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="dashboard.html"><i class="bi bi-trophy me-1"></i> Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="kuis.html"><i class="bi bi-controller me-1"></i> Kuis Edukasi</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="panduan.html"><i class="bi bi-journal-text me-1"></i> Panduan</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a href="profile.html" class="btn btn-light btn-sm rounded-pill px-3 py-2 fw-bold text-success shadow-sm d-flex align-items-center gap-1">
                        <i class="bi bi-person-circle fs-6"></i> <span id="welcomeUserText">Profil</span>
                    </a>
                    <button class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Keluar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 750px;">
        <div class="card shadow-lg animate__animated animate__fadeInUp">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge bg-success bg-opacity-10 text-success fs-6 px-3 py-2 rounded-pill mb-2"><i class="bi bi-lightning-charge-fill me-1"></i> AI Computer Vision Presisi</span>
                    <h2 class="fw-bold text-success m-0">Smart Scan Sampah</h2>
                    <p class="text-muted mt-2">Pindai atau unggah foto untuk mendeteksi jenis sampah secara akurat.</p>
                </div>

                <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="scanTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active rounded-pill py-2" data-bs-toggle="pill" data-bs-target="#cameraSection" onclick="stopCamera()">
                            <i class="bi bi-camera-video-fill me-2"></i> Kamera Langsung
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill py-2" data-bs-toggle="pill" data-bs-target="#gallerySection" onclick="stopCamera()">
                            <i class="bi bi-image-fill me-2"></i> Upload Galeri
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active text-center" id="cameraSection">
                        <div class="preview-box p-3 mb-3 flex-column">
                            <video id="videoElement" autoplay playsinline class="d-none"></video>
                            <canvas id="canvasElement" class="d-none"></canvas>
                            <img id="capturedPreview" src="" class="d-none img-fluid mb-2">
                            <div id="cameraPlaceholder" class="text-muted py-4">
                                <i class="bi bi-camera2 text-success display-3 mb-3"></i>
                                <p class="mb-0 fw-medium">Aktifkan kamera untuk mulai memindai.</p>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="button" id="btnStartCam" class="btn btn-outline-success rounded-pill px-4 py-2 fw-semibold" onclick="startCamera()">Aktifkan Kamera</button>
                            <button type="button" id="btnCapture" class="btn btn-success rounded-pill px-4 py-2 fw-semibold d-none" onclick="capturePhoto()">Ambil Foto</button>
                            <button type="button" id="btnRetake" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold d-none" onclick="retakePhoto()">Foto Ulang</button>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="gallerySection">
                        <div class="preview-box p-4 mb-3 text-center" style="cursor: pointer;" onclick="document.getElementById('imageFile').click()">
                            <input type="file" id="imageFile" accept="image/*" class="d-none" onchange="handleGalleryFile(event)">
                            <div id="galleryPlaceholder" class="py-4">
                                <i class="bi bi-cloud-arrow-up-fill text-success display-3 mb-3"></i>
                                <h5 class="fw-bold text-dark mb-1">Klik untuk Pilih Foto dari Galeri</h5>
                            </div>
                            <div id="galleryPreviewContainer" class="d-none">
                                <img id="imagePreview" src="" class="img-fluid mb-2">
                                <p class="text-success small fw-semibold m-0" id="fileName">file.jpg</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="button" id="btnAnalyze" class="btn btn-success flex-grow-1 py-3 fw-bold rounded-pill shadow" onclick="submitScan()" disabled>
                        <i class="bi bi-magic me-2"></i> Analisis Otomatis dengan AI
                    </button>
                    <button type="button" id="btnReset" class="btn btn-outline-danger py-3 px-4 fw-bold rounded-pill shadow-sm d-none" onclick="resetAll()" title="Hapus Foto">
                        <i class="bi bi-trash-fill fs-5"></i>
                    </button>
                </div>

                <div id="resultContainer" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let userId = localStorage.getItem('user_id');
        let namaUser = localStorage.getItem('nama_user');
        let selectedBlob = null;
        let mediaStream = null;

        if (!userId) window.location.href = 'index.html';
        else document.getElementById('welcomeUserText').innerText = namaUser || 'Profil';

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        async function startCamera() {
            stopCamera();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('videoElement');
                video.srcObject = mediaStream;
                video.classList.remove('d-none');
                document.getElementById('cameraPlaceholder').classList.add('d-none');
                document.getElementById('btnStartCam').classList.add('d-none');
                document.getElementById('btnCapture').classList.remove('d-none');
            } catch (err) { alert("Tidak dapat mengakses kamera."); }
        }

        function stopCamera() {
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            document.getElementById('videoElement').classList.add('d-none');
        }

        function capturePhoto() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                selectedBlob = blob;
                const preview = document.getElementById('capturedPreview');
                preview.src = URL.createObjectURL(blob);
                preview.classList.remove('d-none');
                stopCamera();
                document.getElementById('btnCapture').classList.add('d-none');
                document.getElementById('btnRetake').classList.remove('d-none');
                document.getElementById('btnAnalyze').disabled = false;
                document.getElementById('btnReset').classList.remove('d-none');
            }, 'image/jpeg');
        }

        function retakePhoto() {
            document.getElementById('capturedPreview').classList.add('d-none');
            document.getElementById('btnRetake').classList.add('d-none');
            document.getElementById('btnAnalyze').disabled = true;
            document.getElementById('btnReset').classList.add('d-none');
            selectedBlob = null;
            startCamera();
        }

        function handleGalleryFile(e) {
            const file = e.target.files[0];
            if (file) {
                selectedBlob = file;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('imagePreview').src = evt.target.result;
                    document.getElementById('fileName').innerText = file.name;
                    document.getElementById('galleryPlaceholder').classList.add('d-none');
                    document.getElementById('galleryPreviewContainer').classList.remove('d-none');
                    document.getElementById('btnAnalyze').disabled = false;
                    document.getElementById('btnReset').classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            }
        }

        function resetAll() {
            selectedBlob = null;
            stopCamera();
            document.getElementById('capturedPreview').classList.add('d-none');
            document.getElementById('cameraPlaceholder').classList.remove('d-none');
            document.getElementById('btnStartCam').classList.remove('d-none');
            document.getElementById('btnCapture').classList.add('d-none');
            document.getElementById('btnRetake').classList.add('d-none');
            document.getElementById('imageFile').value = '';
            document.getElementById('galleryPreviewContainer').classList.add('d-none');
            document.getElementById('galleryPlaceholder').classList.remove('d-none');
            document.getElementById('btnAnalyze').disabled = true;
            document.getElementById('btnReset').classList.add('d-none');
            document.getElementById('resultContainer').innerHTML = '';
        }

        async function submitScan() {
            if (!selectedBlob) return alert('Pilih foto terlebih dahulu!');
            document.getElementById('btnAnalyze').disabled = true;

            const previewBox = document.querySelector('.preview-box');
            previewBox.insertAdjacentHTML('beforeend', `
                <div class="scanning-overlay" id="scanningOverlay">
                    <div class="scanner-line"></div>
                    <div class="spinner-border text-light mb-2"></div>
                    <h6 class="fw-bold text-white bg-success px-3 py-1 rounded-pill shadow">AI Memindai Objek...</h6>
                </div>
            `);

            const formData = new FormData();
            formData.append('image', selectedBlob, 'scan.jpg');
            formData.append('user_id', userId);

            try {
                const res = await fetch('/api/scan', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('scanningOverlay')?.remove();
                document.getElementById('btnAnalyze').disabled = false;
                document.getElementById('btnAnalyze').innerHTML = '<i class="bi bi-magic me-2"></i> Analisis Otomatis dengan AI';

                if (data.success) {
                    document.getElementById('resultContainer').innerHTML = `
                        <div class="card result-card shadow-sm p-4 animate__animated animate__zoomIn">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-check-circle-fill text-success fs-3 me-2"></i>
                                <h5 class="fw-bold text-success m-0">Klasifikasi Berhasil! (+${data.poin} Poin)</h5>
                            </div>
                            <h4 class="fw-bold text-dark mt-2">${data.kategori}</h4>
                            <hr class="text-muted opacity-25">
                            <h6 class="fw-bold text-success mb-2"><i class="bi bi-journal-check me-2"></i>Panduan Pengolahan:</h6>
                            <p class="mb-0 text-secondary" style="white-space: pre-line; line-height: 1.6;">${data.deskripsi}</p>
                        </div>
                    `;
                } else { alert(data.message); }
            } catch (err) {
                document.getElementById('scanningOverlay')?.remove();
                document.getElementById('btnAnalyze').disabled = false;
                alert('Gagal terhubung ke server.');
            }
        }
    </script>
</body>
</html>
