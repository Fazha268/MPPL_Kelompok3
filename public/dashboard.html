<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Sortify AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary-green: #059669; }
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { backdrop-filter: blur(10px); background-color: rgba(5, 150, 105, 0.95) !important; }
        .card { border: none; border-radius: 1.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .nav-pills .nav-link.active { background-color: var(--primary-green); font-weight: 600; }
        .nav-pills .nav-link { color: var(--primary-green); font-weight: 500; }
        .podium-card { background: #ffffff; border-radius: 1.5rem; transition: transform 0.3s; }
        .podium-card:hover { transform: translateY(-5px); }
        .rank-badge { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3 mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="upload.html">
                <i class="bi bi-recycle text-light fs-3"></i> Sortify <span class="badge bg-light text-success fs-6">AI Pro</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="upload.html"><i class="bi bi-cpu me-1"></i> Smart Scan</a></li>
                    <li class="nav-item"><a class="nav-link active rounded-pill px-3 py-2" href="dashboard.html"><i class="bi bi-trophy me-1"></i> Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="kuis.html"><i class="bi bi-controller me-1"></i> Kuis Edukasi</a></li>
                    <li class="nav-item"><a class="nav-link rounded-pill px-3 py-2" href="panduan.html"><i class="bi bi-journal-text me-1"></i> Panduan</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a href="profile.html" class="btn btn-light btn-sm rounded-pill px-3 py-2 fw-bold text-success shadow-sm d-flex align-items-center gap-1">
                        <i class="bi bi-person-circle fs-6"></i> 
                        <span id="welcomeUserText">Profil</span>
                    </a>
                    <button class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Keluar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 850px;">
        <div class="card shadow-lg p-4 p-md-5 mb-4 text-white text-center" style="background: linear-gradient(135deg, #059669 0%, #047857 100%);">
            <i class="bi bi-trophy-fill display-3 text-warning mb-2"></i>
            <h1 class="fw-bold mb-2">Papan Peringkat Pahlawan Lingkungan</h1>
            <p class="mb-0 opacity-75">Kumpulkan poin dari scan sampah dan kuis untuk menjadi yang teratas!</p>
        </div>

        <div class="row g-3 mb-4 text-center" id="podiumContainer"></div>

        <div class="card shadow-lg">
            <div class="card-body p-4">
                <h5 class="fw-bold text-success mb-3"><i class="bi bi-list-stars me-2"></i>Peringkat Keseluruhan</h5>
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 rounded-start">Peringkat</th>
                                <th class="py-3">Nama</th>
                                <th class="py-3">Kelas</th>
                                <th class="py-3 text-end rounded-end">Total Poin</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardTableBody">
                            <tr><td colspan="4" class="text-center py-4 text-muted">Memuat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let userId = localStorage.getItem('user_id');
        let namaUser = localStorage.getItem('nama_user');
        if (!userId) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUserText').innerText = namaUser || 'Profil';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const tbody = document.getElementById('leaderboardTableBody');
                const podium = document.getElementById('podiumContainer');
                tbody.innerHTML = '';
                podium.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) return;

                let podiumHTML = '';
                const medals = ['🥇', '🥈', '🥉'];
                const borders = ['border-warning', 'border-secondary', 'border-danger'];

                for (let i = 0; i < Math.min(3, data.length); i++) {
                    const u = data[i];
                    podiumHTML += `
                        <div class="col-md-4">
                            <div class="card podium-card p-3 border-2 ${borders[i]} shadow-sm h-100">
                                <div class="fs-1 mb-1">${medals[i]}</div>
                                <h5 class="fw-bold text-dark mb-1">${u.nama}</h5>
                                <span class="badge bg-light text-muted mb-2">${u.kelas}</span>
                                <h4 class="fw-bold text-success mt-auto mb-0">${u.total_poin} Poin</h4>
                            </div>
                        </div>
                    `;
                }
                podium.innerHTML = podiumHTML;

                data.forEach((u, index) => {
                    let badge = 'bg-light text-dark';
                    if (index === 0) badge = 'bg-warning text-dark';
                    else if (index === 1) badge = 'bg-secondary text-white';
                    else if (index === 2) badge = 'bg-danger text-white';

                    const isMe = u.id == userId ? 'table-success fw-bold' : '';
                    tbody.innerHTML += `
                        <tr class="${isMe}">
                            <td class="py-3"><span class="rank-badge ${badge}">${index + 1}</span></td>
                            <td class="py-3">${u.nama} ${u.id == userId ? '<span class="badge bg-success ms-2">Kamu</span>' : ''}</td>
                            <td class="py-3 text-muted">${u.kelas}</td>
                            <td class="py-3 text-end fw-bold text-success">${u.total_poin} Poin</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }
        loadLeaderboard();
    </script>
</body>
</html>
